name: trades
source:
  collection: trades
  database: Documents
target:
  table: TRADES
  key: DOC_URI
  mode: merge
raw:
  include: true
  column: RAW_DOC
columns:
  TRADE_ID:
    path: trade.@id
    type: STRING
  TRADE_VENUE:
    path: trade.@venue
    type: STRING
  TRADE_COUNTERPARTIES_CP_TEXT:
    path: trade.counterparties.cp[].#text
    type: VARIANT
    note: repeating - stored as VARIANT array
  TRADE_COUNTERPARTIES_CP_ROLE:
    path: trade.counterparties.cp[].@role
    type: VARIANT
    note: repeating - stored as VARIANT array
  TRADE_INSTRUMENT_ISIN:
    path: trade.instrument.isin
    type: STRING
  TRADE_INSTRUMENT_NAME:
    path: trade.instrument.name
    type: STRING
  TRADE_NOTIONAL_TEXT:
    path: trade.notional.#text
    type: STRING
  TRADE_NOTIONAL_CURRENCY:
    path: trade.notional.@currency
    type: STRING
  TRADE_TRADE_DATE:
    path: trade.tradeDate
    type: DATE
